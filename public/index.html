<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Bot WhatsApp</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 { margin-bottom: 20px; color: #38bdf8; }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #475569;
            border-radius: 6px;
            background-color: #0f172a;
            color: white;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background-color: #0ea5e9; }
        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #4ade80;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Lier votre Bot WhatsApp</h2>
        <form id="pairingForm">
            <input type="text" id="phone" placeholder="Ex: 2376xxxxxxxx" required>
            <button type="submit">Obtenir le Code</button>
        </form>
        <div id="result"></div>
    </div>

    <script>
        document.getElementById('pairingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const phone = document.getElementById('phone').value;
            const resultDiv = document.getElementById('result');
            
            resultDiv.innerText = "Génération du code en cours...";

            try {
                const response = await fetch('/connect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone })
                });
                const data = await response.json();

                if (data.success) {
                    resultDiv.innerHTML = Votre code de liaison : <br><span style="font-size: 24px; color: #facc15;">${data.code}</span>;
                } else {
                    resultDiv.innerText = data.message || "Une erreur est survenue.";
                }
            } catch (err) {
                resultDiv.innerText = "Erreur de connexion au serveur.";
            }
        });
    </script>
</body>
</html>
